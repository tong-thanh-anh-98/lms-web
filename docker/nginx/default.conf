server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    # Phục vụ uploads (video, hình ảnh...)
    location /uploads/ {
        alias /var/www/html/public/uploads/;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Range support (quan trọng để tua & hiển thị thời lượng)
        add_header Accept-Ranges bytes always;

        # Trả OPTIONS cho preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }

        types {
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogg;
            image/jpeg jpg jpeg;
            image/png png;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|bak|config|sql)$ {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
