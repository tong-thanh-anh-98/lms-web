server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bảo mật
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Serve video files directly
    # location /uploads/courses/videos/ {
    #     root /var/www/html/public;
    #     types {
    #         video/mp4 mp4;
    #     }
    #     add_header Accept-Ranges bytes;
    # }
    location /uploads/courses/videos/ {
        alias /var/www/html/public/uploads/courses/videos/;

        # MIME type video
        types {
            video/mp4 mp4;
        }

        # Cho phép range request để ReactPlayer seek được
        add_header Accept-Ranges bytes always;

        # CORS cho ReactPlayer
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Origin, Content-Type, Accept' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

        # OPTIONS request (preflight)
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
