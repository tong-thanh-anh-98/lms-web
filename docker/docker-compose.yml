version: '3.8'

services:
  # Laravel (PHP-FPM)
  app:
    build:
      context: ../
      dockerfile: ./docker/php/Dockerfile
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    # restart: always
    networks:
      - app-network

  # Nginx
  web:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    # restart: always
    networks:
      - app-network

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_lsm
    volumes:
      - mysql-data:/var/lib/mysql
    # restart: always
    networks:
      - app-network

  # ReactJS + Vite
  frontend:
    image: node:23.6.0
    container_name: react-app
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules  #  mount riêng node_modules nội bộ
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    # restart: always  # hoặc bạn có thể xóa nếu không muốn auto restart trong dev
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    # restart: always
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
