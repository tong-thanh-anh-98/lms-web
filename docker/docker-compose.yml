services:
  # Laravel (PHP-FPM)
  app:
    build:
      context: ../
      dockerfile: ./docker/php/Dockerfile
    container_name: lsm-laravel-app
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - mysql-lsm
      - redis
    environment:
      - DB_HOST=mysql-lsm
      - DB_PORT=3306
    networks:
      - network-lsm

  # Nginx
  web:
    image: nginx:alpine
    container_name: lsm-nginx
    ports:
      - "9080:80"
    volumes:
      - ../backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - network-lsm

  # MySQL
  mysql-lsm:
    image: mysql:8.0
    container_name: lsm-mysql
    ports:
      - "9306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_lsm
    volumes:
      - lsm-mysql-data:/var/lib/mysql
    networks:
      - network-lsm

  # Redis
  redis:
    image: redis:alpine
    container_name: lsm-redis
    ports:
      - "9379:6379"
    networks:
      - network-lsm

  # Mailhog
  mailhog:
    image: mailhog/mailhog
    container_name: lsm-mailhog
    ports:
      - "9025:8025"
      - "9125:1025"
    networks:
      - network-lsm

  # ReactJS + Vite
  frontend:
    image: node:23.6.0
    container_name: lsm-react-app
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "9173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - network-lsm

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lsm-phpmyadmin
    ports:
      - "9180:80"
    environment:
      PMA_HOST: mysql-lsm
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql-lsm
    networks:
      - network-lsm

volumes:
  lsm-mysql-data:

networks:
  network-lsm:
    driver: bridge